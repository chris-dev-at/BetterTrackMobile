[versions]
agp = "9.2.1"
# AGP 9.2.1's built-in Kotlin (kotlin-gradle-plugin) is 2.2.10, but the KMP/iOS
# port needs 2.3.20, so the build OVERRIDES it: the root build.gradle.kts
# declares `org.jetbrains.kotlin.multiplatform` at this version with
# `apply false`, whose plugin marker depends on kotlin-gradle-plugin 2.3.20.
# Gradle's conflict resolution then raises kotlin-gradle-plugin 2.2.10 -> 2.3.20
# for the WHOLE build classpath, including :app's built-in-Kotlin compilation.
# (:app must still NOT apply `org.jetbrains.kotlin.android` — doing so fails with
# "Cannot add extension with name (kotlin)"; the override is classpath-only.)
# The Compose compiler and kotlinx-serialization compiler plugins below are
# pinned to this SAME version so there is no compiler/Kotlin mismatch.
# Do not bump one without the others (KSP included, see `ksp`).
kotlin = "2.3.20"
coreKtx = "1.19.0"
coreSplashscreen = "1.2.0"
composeBom = "2026.06.01"
activityCompose = "1.13.0"
navigationCompose = "2.9.8"
lifecycleRuntimeCompose = "2.11.0"
# kotlinx-serialization runtime (typed nav routes). 1.9.0 is compatible with the
# 2.3.x serialization compiler plugin — the runtime is not version-locked to it.
kotlinxSerializationJson = "1.9.0"
# material-icons was dropped from recent Compose BOMs; last published version.
materialIconsExtended = "1.7.8"
junit = "4.13.2"
junitVersion = "1.3.0"
# Pure-JVM SQLite for the Room migration regression suite (test-only). Pinned to
# the version Room's own compiler already resolves, so it adds nothing new to the
# dependency graph.
sqliteJdbc = "3.41.2.2"
espressoCore = "3.7.0"

# ── Step 5 (local database & sync engine core) ─────────────────────────────
# Room needs KSP. KSP used to version as `<kotlin>-<ksp>` (we were on
# 2.2.10-2.0.2) and its Kotlin half had to match the compiler exactly. From KSP
# 2.3.0 that scheme is gone — KSP now publishes a plain version that tracks the
# Kotlin LANGUAGE line, so 2.3.x pairs with any Kotlin 2.3.x. 2.3.11 is the
# release verified against Kotlin 2.3.20 here. Still do not bump across a Kotlin
# minor independently of `kotlin` above.
ksp = "2.3.11"
room = "2.8.4"
# WorkManager drives the outbound-queue drain (connectivity + backoff, §7.3).
workManager = "2.11.2"
# ProcessLifecycleOwner for the app-foreground drain trigger.
lifecycleProcess = "2.11.0"

# ── Step 4 (login + API client) ────────────────────────────────────────────
# Chrome Custom Tabs for the OAuth authorize page (never a WebView, spec §4).
androidxBrowser = "1.8.0"
# Retrofit + OkHttp + the official kotlinx.serialization converter for the API
# client layer. OkHttp's Authenticator drives the reactive 401→refresh→retry.
retrofit = "2.11.0"
okhttp = "4.12.0"
# EncryptedSharedPreferences (Keystore-backed) for access/refresh tokens (§4).
securityCrypto = "1.1.0-alpha06"
# viewModel() in Compose + coroutines for the auth flow / single-flight refresh.
lifecycleViewmodelCompose = "2.11.0"
kotlinxCoroutines = "1.10.2"
# androidx.sqlite — used ONLY by :shared/iosMain (the BundledSQLiteDriver that
# backs the KMP Room database on Kotlin/Native). Pinned to 2.6.2 = the version
# :app already resolves transitively through Room 2.8.4 (verified via
# :app:dependencies), so nothing new lands on :app's classpath. It is declared in
# iosMain only, so it never reaches the Android build at all.
androidxSqlite = "2.6.2"

# ── Step 17 (app lock: local PIN + biometrics, spec §5) ────────────────────
# AndroidX BiometricPrompt smooths the API 28→33 biometric surface (fingerprint/
# face) and gives one canAuthenticate() availability check. It hosts on a
# FragmentActivity, so `fragment` is pinned to a modern version aligned with
# lifecycle 2.11 (biometric 1.1.0 would otherwise drag in fragment 1.2.5).
androidxBiometric = "1.1.0"
androidxFragment = "1.8.5"

# ── Step 16 (notifications: FCM push client) ───────────────────────────────
# Firebase Cloud Messaging client. The google-services plugin reads the already-
# placed app/google-services.json (project bettertrackapp-c6996). Versions come
# from the Firebase BoM so the FCM artifact stays mutually consistent. Only the
# CLIENT is wired here — device-token registration + real push SENDING are
# platform-gated (no device-token endpoint exists yet; see docs/TODO.md).
googleServices = "4.5.0"
firebaseBom = "34.15.0"

# ── Step 18 (settings & account management, spec §6.12) ────────────────────
# Per-app language switch (EN/DE) via AppCompatDelegate.setApplicationLocales +
# the autoStoreLocales service (persists on API < 33; framework path on 33+).
# appcompat is used ONLY for its locale delegate — MainActivity stays a
# FragmentActivity (no AppCompatActivity/theme requirement is introduced).
androidxAppcompat = "1.7.1"
# ZXing core — pure-Java, offline QR encoder for the 2FA authenticator (TOTP)
# enrollment QR. No network, no external assets (CSP/self-contained).
zxingCore = "3.5.3"

# ── W3 (BTVAULT1 vault crypto, docs/S3S4_STORAGE_PLAN.md §2.2) ─────────────
# Bouncy Castle provider — used ONLY for its lightweight (non-JCA-provider)
# `org.bouncycastle.crypto.generators.Argon2BytesGenerator`. Argon2id is the
# vault KEK derivation and the JDK/Android platform has no implementation of it.
# Deliberately NOT an Android-native argon2 JNI binding: BC is pure Java, so the
# identical code path runs in plain JVM unit tests, which is what lets the
# byte-for-byte vault conformance suite gate CI. AES-GCM stays on JCA.
# Verified against the platform's published oracle
# (apps/web/src/user/vault/vectors.fixture.json `kekBase64`): BC 1.80 with
# ARGON2_id + ARGON2_VERSION_13 + m=65536 KiB/t=3/p=1/len=32 reproduces it
# exactly. Argon2 version 1.0 does NOT — the version is part of the contract.
bouncycastle = "1.80"

# ── KMP/iOS port, Phase 1 (docs/KMP_PLAN.md) ───────────────────────────────
# Compose Multiplatform — the iOS UI toolkit for the :shared module. This is a
# HARD CEILING, not a "latest wins" pin: 1.11.x fails to LINK against the
# iOS 18.4 SDK on the Xcode 16.3 installed here, with
#   Undefined symbols for architecture arm64: "_OBJC_CLASS_$_UIViewLayoutRegion"
#   Could not find or use auto-linked framework 'UIUtilities'
# because 1.11 binds UIKit symbols that only exist in a newer SDK. 1.10.3 is the
# newest release that links and runs on this toolchain. Do NOT bump it until
# Xcode itself is upgraded and the iOS app is re-verified on a simulator.
#
# Note this is INDEPENDENT of `composeBom` above: that BOM versions ANDROIDX
# Compose (androidx.compose.*, :app only), while this versions JETBRAINS Compose
# (org.jetbrains.compose.*, :shared only). Both are driven by the SAME Compose
# COMPILER plugin (`compose-compiler`, pinned to `kotlin`), which is why the
# compiler plugin version must keep tracking `kotlin` and not either of these.
composeMultiplatform = "1.10.3"

# ── KMP/iOS port, Phase 2 (docs/KMP_PLAN.md — shared-core migration) ─────────
# kotlinx-datetime backs the domain layer's JS-runtime date shims once they move
# to :shared/commonMain (DomainTypes.jsDateOnlyToMs / jsDateParse / jsIsoDay and
# Tax.viennaYearOf). The Android app previously reached those through java.time,
# which does not exist on Kotlin/Native; kotlinx-datetime is the multiplatform
# replacement that compiles for BOTH the JVM/Android target and iosArm64/
# iosSimulatorArm64. It carries its own IANA tz database on Native, which is what
# lets `TimeZone.of("Europe/Vienna")` resolve the tax-year boundary on-device
# without the JVM. 0.8.0 is the release verified to compile AND link for
# iosSimulatorArm64 on this stack (Kotlin 2.3.20). NOTE for 0.8.0: `Clock` now
# lives at `kotlin.time.Clock` and instants are `kotlin.time.Instant`; there is
# no `OffsetDateTime` — an offset timestamp parses via
# `DateTimeComponents.Formats.ISO_DATE_TIME_OFFSET.parse(s).toInstantUsingOffset()`.
# Added to :shared commonMain ONLY (never to :app — the app reaches it through
# :shared), so the Android shipping dependency graph gains nothing new.
kotlinxDatetime = "0.8.0"

# ── KMP/iOS port, Phase 2 (network layer — iOS Ktor client, Option B) ────────
# Ktor is the iOS HTTP stack that REPRODUCES Android's Retrofit/OkHttp session
# behaviours (AuthInterceptor+TokenAuthenticator, ConditionalGetInterceptor). It
# is declared for :shared iosMain/iosTest ONLY — never commonMain/androidMain —
# so it NEVER enters :app's classpath (Android keeps Retrofit/OkHttp verbatim;
# owner-mandated Option B). Same iosMain-only pattern as androidx-sqlite-bundled.
# 3.5.2 is the Ktor 3.x release verified to compile+link for iosSimulatorArm64 on
# this Kotlin 2.3.20 / Xcode 16.3 stack. ktor-client-mock is TEST-scoped (iosTest)
# and drives the three session-integrity behavioural proofs via MockEngine.
ktor = "3.5.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
# KMP/iOS Phase 2 — multiplatform date/time for the migrated domain shims
# (:shared commonMain only; see the `kotlinxDatetime` version note above).
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinxDatetime" }

# Jetpack Compose — versions come from the BOM below (leave version off the rest)
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIconsExtended" }
# Compose RUNTIME on its own. :app never needs to name it (it arrives
# transitively via ui/material3), but :shared's ANDROID target must put it on
# the compile classpath explicitly or the Compose compiler plugin aborts with
# IncompatibleComposeRuntimeVersionException. Version-less on purpose: it
# resolves through the SAME `androidx-compose-bom` :app uses, which is what
# guarantees :shared cannot drag the app onto a different Compose version.
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }

# Step 4 — login + API client
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "androidxBrowser" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
# KMP/iOS port, Phase 2 (Room -> :shared) — coroutines-core for the DAO `Flow<>`
# return types now that the DAOs compile in commonMain. Same version :app already
# resolves (1.10.2), added to :shared/commonMain only, so :app's graph is unchanged.
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# Step 17 — app lock: BiometricPrompt + its FragmentActivity host.
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "androidxBiometric" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "androidxFragment" }

# Step 16 — Firebase Cloud Messaging (FCM push client). Version-less: the BoM
# platform below pins firebase-messaging so it stays consistent.
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }

# Step 18 — per-app language switch + 2FA QR encoder.
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidxAppcompat" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxingCore" }

# W3 — Argon2id for the BTVAULT1 vault KEK (see the version note above).
bouncycastle-prov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }

# Step 5 — Room (local DB) + WorkManager (sync worker) + process lifecycle.
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
# BundledSQLiteDriver for the KMP Room database on Kotlin/Native (:shared iosMain
# ONLY). See the androidxSqlite version note — this never reaches :app.
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "androidxSqlite" }

# KMP/iOS Phase 2 — Ktor (iOS network layer, :shared iosMain/iosTest ONLY; see
# the `ktor` version note above — these never reach :app).
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-darwin = { group = "io.ktor", name = "ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }
# Web port, Phase W0 — the BROWSER engine for the same Ktor client iOS runs. One
# artifact serves both the js and wasmJs targets (there is no separate
# "ktor-client-wasm"); it publishes a wasmJs variant at 3.5.2, the version §6.6
# already verified, so nothing moved for the web. :shared wasmJsMain ONLY —
# never reaches :app.
ktor-client-js = { group = "io.ktor", name = "ktor-client-js", version.ref = "ktor" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycleProcess" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
# Real SQLite in a plain JVM unit test — the only way to execute the Room
# migration chain (and Room's own schema comparison) without a device or an
# emulator. Same engine family the app runs on; test-only, never shipped.
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqliteJdbc" }
# MockWebServer version-aligns with OkHttp above — wire-level tests of the
# Retrofit client (e.g. the Idempotency-Key header on queue mutations).
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Declared `apply false` in the ROOT build.gradle.kts, and APPLIED by :shared
# (Phase 1 of the KMP/iOS port — the shared module has now landed).
# It keeps its second, older job as well: merely being on the root plugins block
# puts kotlin-gradle-plugin 2.3.20 on the build classpath so Gradle's conflict
# resolution overrides AGP 9's built-in Kotlin 2.2.10 for the WHOLE build (see
# the long note at `kotlin` above). :app still must NOT apply any Kotlin plugin.
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
# Compose compiler plugin — must track the Kotlin version (see note above).
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Serialization compiler plugin — must track the Kotlin version too.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# KSP for the Room compiler — must stay on the same Kotlin line as `kotlin`.
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# Room's own Gradle plugin (tracks `room`). Owns the exported-schema directory as
# a first-class Gradle input/output via `room { schemaDirectory(...) }`, instead
# of the legacy `ksp { arg("room.schemaLocation", …) }` which does not register
# the dir with the task graph and mis-caches. Turning exportSchema on (KMP/iOS
# port, D7) needs this: the golden v10 schema JSON is the artifact that
# mechanically proves a Room build reproduces the schema real users hold on disk.
androidx-room = { id = "androidx.room", version.ref = "room" }
# Step 16 — google-services processes app/google-services.json for FCM.
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }

# ── KMP/iOS port, Phase 1 ──────────────────────────────────────────────────
# The ANDROID target of a Kotlin Multiplatform module. This is deliberately NOT
# `com.android.library`: AGP 9 hard-REJECTS combining that with
# kotlin.multiplatform ("The Android Gradle plugin library plugin is not
# compatible with the Kotlin Multiplatform plugin since AGP 9.0"). The
# KMP-specific variant below is the only supported pairing, and it ships in AGP
# itself — hence `version.ref = "agp"`, never a version of its own.
# At Kotlin 2.3.20 its DSL lives at `kotlin { android { … } }`; the older
# top-level `androidLibrary { }` block is deprecated and warns.
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
# Compose Multiplatform's Gradle plugin — provides the `compose.*` dependency
# accessors (compose.runtime / compose.foundation / compose.material3) that
# resolve per-target, so :shared's UI compiles for BOTH Android and iOS. It is
# the RUNTIME/library half only: the Kotlin compiler half is `compose-compiler`
# above, and BOTH must be applied to :shared (the JetBrains plugin does not pull
# the compiler plugin in for you on a KMP module).
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
