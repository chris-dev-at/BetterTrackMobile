    <!-- The app icon, INLINED as a data: URI (web port, W1).

         `art/BT_AppIcon.png` — the same 1001x1001 mark the Android launcher
         icon is cut from, dark rounded square and all — base64'd straight into
         this file rather than served as a separate asset. Two reasons, both
         deliberate:

           * no external fetch, ever. An authenticated dashboard must not tell a
             CDN (or anyone else) that this user opened BetterTrack, and a
             favicon is requested before anything else on the page;
           * no extra round trip on first paint, and nothing to 404 if the
             distribution is served from a sub-path.

         The in-app brand mark is a different file and travels a different way:
         `splash_bt_glyph.png` is a compose-resource in the bundle, decoded
         before the first frame (see BtWebAssets.kt). This one is transparent
         over dark; that one is transparent over nothing, because the login
         screen paints its own page colour behind it. -->

    <style>
        /* The page paints the app background BEFORE the wasm module loads, so the
           first frame is never a white flash on a dark product. */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #0A0D12;
            color: #8B949F;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overscroll-behavior: none;
        }
        #bootstrap {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            letter-spacing: 0.02em;
        }
        /* No JS hook is needed to hide the bootstrap note: ComposeViewport calls
           attachShadow() on its container — <body> here — and an element with a
           shadow root stops rendering its light-DOM children. The note therefore
           disappears at exactly the moment Compose takes over, which since W1 is
           after the typeface and the brand glyph have been read out of the
           bundle (see Main.kt). */
    </style>
</head>
<body>
    <div id="bootstrap">BetterTrack — loading</div>
    <script type="application/javascript" src="webApp.js"></script>
</body>
</html>
